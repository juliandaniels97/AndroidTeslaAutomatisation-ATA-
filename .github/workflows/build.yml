name: Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATA_VERSION_CODE: ${{ github.run_number }}
      ATA_KEYSTORE_BASE64: ${{ secrets.ATA_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: ${{ env.ATA_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ATA_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/ata-release.keystore"
          echo "ATA_KEYSTORE_FILE=${RUNNER_TEMP}/ata-release.keystore" >> "$GITHUB_ENV"
          echo "ATA_KEYSTORE_PASSWORD=${{ secrets.ATA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ATA_KEY_ALIAS=${{ secrets.ATA_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ATA_KEY_PASSWORD=${{ secrets.ATA_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build phone + wear APKs (arm64-v8a)
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :wear:assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Build failed'
            echo '```'
            grep -nE "e: file|e: |error:|Unresolved reference|Compilation error|> Task .*FAILED|FAILURE:|What went wrong|Caused by:|Could not" build.log | grep -viE "warning:|is deprecated" | head -120
            echo '```'
          } > errors.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@errors.md >/dev/null || true

      - name: Collect APKs
        run: |
          mkdir -p dist
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          cp app/build/outputs/apk/release/*.apk "dist/ATA-phone-v${VERSION}-arm64-v8a.apk"
          cp wear/build/outputs/apk/release/*.apk "dist/ATA-wear-v${VERSION}-arm64-v8a.apk"
          ls -la dist

      - name: Publish APKs as pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.ref_name }}
          name: APK build (${{ github.ref_name }})
          prerelease: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ATA ${{ github.ref_name }}
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
