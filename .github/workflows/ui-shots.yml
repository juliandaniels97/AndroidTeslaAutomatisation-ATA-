name: UI screenshots
on:
  push:
    branches: ['ui/**']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      ATA_KEYSTORE_BASE64: ${{ secrets.ATA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          ATA_KEYSTORE_PASSWORD: ${{ secrets.ATA_KEYSTORE_PASSWORD }}
          ATA_KEY_ALIAS: ${{ secrets.ATA_KEY_ALIAS }}
          ATA_KEY_PASSWORD: ${{ secrets.ATA_KEY_PASSWORD }}
        run: |
          echo "${ATA_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/ata-release.keystore"
          {
            echo "ATA_KEYSTORE_FILE=${RUNNER_TEMP}/ata-release.keystore"
            echo "ATA_KEYSTORE_PASSWORD=${ATA_KEYSTORE_PASSWORD}"
            echo "ATA_KEY_ALIAS=${ATA_KEY_ALIAS}"
            echo "ATA_KEY_PASSWORD=${ATA_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon :app:assembleRelease -PataAllAbis
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/ui-shots.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)" shots
      - name: Push screenshots to branch ui-shots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd shots
          git init -q -b ui-shots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ui-shots

  wear-shots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [wearos_large_round, wearos_square]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :wear:assembleDebug -PataAllAbis
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash .github/wear-shots.sh "$(ls wear/build/outputs/apk/debug/*.apk | head -1)" shots
      - name: Push screenshots to branch ui-shots-${{ matrix.profile }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd shots
          git init -q -b ui-shots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ui-shots-${{ matrix.profile }}
