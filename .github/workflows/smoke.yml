name: Emulator smoke test
on:
  push:
    branches: ['debug/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            module: app
            api: 36
            target: google_apis
          - name: wear
            module: wear
            api: 34
            target: android-wear
    env:
      ATA_KEYSTORE_BASE64: ${{ secrets.ATA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          ATA_KEYSTORE_PASSWORD: ${{ secrets.ATA_KEYSTORE_PASSWORD }}
          ATA_KEY_ALIAS: ${{ secrets.ATA_KEY_ALIAS }}
          ATA_KEY_PASSWORD: ${{ secrets.ATA_KEY_PASSWORD }}
        run: |
          echo "${ATA_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/ata-release.keystore"
          {
            echo "ATA_KEYSTORE_FILE=${RUNNER_TEMP}/ata-release.keystore"
            echo "ATA_KEYSTORE_PASSWORD=${ATA_KEYSTORE_PASSWORD}"
            echo "ATA_KEY_ALIAS=${ATA_KEY_ALIAS}"
            echo "ATA_KEY_PASSWORD=${ATA_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Build release APK (all ABIs)
        run: ./gradlew --no-daemon :${{ matrix.module }}:assembleRelease -PataAllAbis
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: |
            if [ "${{ matrix.name }}" = phone ]; then bash .github/smoke.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)" phone "-n org.tfv.ata/.ui.MainActivity" "-n org.tfv.ata/.shortcut.CreateShortcutActivity" "-a org.tfv.ata.action.RUN -n org.tfv.ata/.automation.RunActionActivity --es action_id open_tesla_app" "-a org.tfv.ata.action.RUN -n org.tfv.ata/.automation.RunActionActivity --es action_id climate_on"; else bash .github/smoke.sh "$(ls wear/build/outputs/apk/release/*.apk | head -1)" wear "-n org.tfv.ata/.wear.WearMainActivity"; fi
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### Smoke test ${{ matrix.name }}'; echo '```'; cat smoke-${{ matrix.name }}.txt 2>/dev/null | head -c 30000; echo '```'; } > out.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@out.md >/dev/null
